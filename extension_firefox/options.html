<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>إعدادات PyDM</title>
<style>
  body { font: 14px/1.6 "Segoe UI", Tahoma, Arial, sans-serif; max-width: 560px; margin: 24px auto; color: #1d2733; }
  label { display: block; margin: 10px 0 2px; font-weight: 600; }
  input[type=number], textarea { width: 100%; box-sizing: border-box; padding: 6px; }
  .chk { font-weight: normal; display: flex; gap: 6px; align-items: center; }
  button { margin-top: 14px; padding: 6px 18px; border: 0; border-radius: 5px; background: #0b5cad; color: #fff; cursor: pointer; }
  #saved { color: #1b7f3b; margin-inline-start: 10px; }
  small { color: #5b6773; }
</style>
</head>
<body>
  <h2>إعدادات إضافة PyDM</h2>
  <label>منفذ PyDM (يجب أن يطابق الإعدادات داخل البرنامج)</label>
  <input type="number" id="port" min="1024" max="65535">
  <label class="chk"><input type="checkbox" id="intercept"> اعتراض التحميلات وإرسالها إلى PyDM</label>
  <label class="chk"><input type="checkbox" id="interceptAll"> اعتراض كل التحميلات (بدون شروط النوع والحجم)</label>
  <label>الحد الأدنى لحجم الملف للإرسال (KB)</label>
  <input type="number" id="minSizeKB" min="0">
  <label>امتدادات الملفات التي تُرسل دائماً (مفصولة بفاصلة)</label>
  <textarea id="exts" rows="4"></textarea>
  <label class="chk"><input type="checkbox" id="sniff"> رصد روابط الفيديو والصوت في الصفحات</label>
  <small>إذا كان PyDM مغلقاً فسيكمل المتصفح التحميل بنفسه دون تدخل.</small><br>
  <button id="save">حفظ</button><span id="saved"></span>
  <script src="common.js"></script>
  <script src="options.js"></script>
</body>
</html>
